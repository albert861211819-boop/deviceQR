<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設備紀錄系統</title>
    <script src="https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0.0.2/qrcode.min.js"></script>
    <style>
        :root { --primary: #007bff; --bg: #f4f7f6; --admin: #6f42c1; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card { border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        /* 管理員樣式 */
        .admin-box { border: 2px dashed var(--admin); padding: 15px; border-radius: 8px; margin-bottom: 20px; background: #f9f6ff; }
        
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        
        button { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; }
        .btn-submit { background: #28a745; color: white; }
        .btn-qr { background: var(--primary); color: white; margin-top: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: left; }

        /* 紀錄顯示區 */
        .log-list { margin-top: 20px; }
        .log-item { background: #fff; border-left: 5px solid var(--primary); padding: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-size: 14px; }
        .log-time { color: #666; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div id="adminPanel" class="admin-box hidden">
        <h3 style="color:var(--admin); margin-top:0;">🔧 管理員：新增設備</h3>
        <input type="text" id="devName" placeholder="設備名稱">
        <input type="text" id="devID" placeholder="設備編號">
        <button class="btn-submit" style="background:var(--admin)" onclick="addDevice()">加入清單</button>
        
        <table style="margin-top:20px;">
            <thead><tr><th>設備</th><th>操作</th></tr></thead>
            <tbody id="adminListBody"></tbody>
        </table>
    </div>

    <div id="qrBox" class="card hidden" style="text-align: center;">
        <div id="qrcode"></div>
        <p id="qrHint"></p>
        <button onclick="document.getElementById('qrBox').classList.add('hidden')" style="background:#666; color:white;">關閉預覽</button>
    </div>

    <div id="testView" class="hidden">
        <div style="border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px;">
            <h2 id="displayDevName" style="margin:0;"></h2>
            <small id="displayDevID" style="color:#666;"></small>
        </div>

        <div class="card">
            <label>測試機種</label><input type="text" id="testModel" placeholder="例如: Model X">
            <label>使用者</label><input type="text" id="testerName" placeholder="填寫姓名">
            <label>起始時間</label><input type="datetime-local" id="startTime">
            <label>結束時間</label><input type="datetime-local" id="endTime">
            <button id="submitBtn" class="btn-submit" onclick="saveData()">確認並送出紀錄</button>
        </div>

        <div class="log-list">
            <h3>📋 本機歷史紀錄</h3>
            <div id="logContent"></div>
        </div>
    </div>
    
    <div id="noDataHint" class="hidden" style="text-align:center; color:#999; padding: 40px 0;">
        請使用管理員模式或掃描 QR Code 進入
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysE22tyQy4bra1DsHloJ7Bq6vGDxEt_oDguO2nq1fu0o1HVFRQs-GnvdmHEv_lLRI/exec"; // ⬅ 記得更換
    const ADMIN_PASSWORD = "admin";

    let devices = JSON.parse(localStorage.getItem('dev_db_v3')) || [];
    let testLogs = JSON.parse(localStorage.getItem('test_logs_v3')) || [];

    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const isAdmin = params.get('mode') === ADMIN_PASSWORD;
        const id = params.get('id');
        const name = params.get('name');

        if (isAdmin) {
            document.getElementById('adminPanel').classList.remove('hidden');
            renderAdminTable();
        }

        if (id && name) {
            showTestPage(id, name);
        } else if (!isAdmin) {
            document.getElementById('noDataHint').classList.remove('hidden');
        }
    };

    function addDevice() {
        const name = document.getElementById('devName').value.trim();
        const id = document.getElementById('devID').value.trim();
        if(!name || !id) return alert("請完整填寫");
        devices.push({name, id});
        localStorage.setItem('dev_db_v3', JSON.stringify(devices));
        renderAdminTable();
        document.getElementById('devName').value = '';
        document.getElementById('devID').value = '';
    }

    function renderAdminTable() {
        const body = document.getElementById('adminListBody');
        body.innerHTML = devices.map((d, i) => `
            <tr>
                <td>${d.name} (${d.id})</td>
                <td><button class="btn-qr" style="margin:0; padding:5px;" onclick="makeQR('${d.id}', '${d.name}')">產碼</button></td>
            </tr>
        `).join('');
    }

    function makeQR(id, name) {
        const box = document.getElementById('qrcode');
        box.innerHTML = "";
        const baseUrl = window.location.origin + window.location.pathname;
        const finalUrl = `${baseUrl}?id=${encodeURIComponent(id)}&name=${encodeURIComponent(name)}`;
        new QRCode(box, { text: finalUrl, width: 200, height: 200 });
        document.getElementById('qrHint').innerText = name;
        document.getElementById('qrBox').classList.remove('hidden');
    }

    function showTestPage(id, name) {
        document.getElementById('testView').classList.remove('hidden');
        document.getElementById('displayDevName').innerText = name;
        document.getElementById('displayDevID').innerText = id;
        renderLogs(id);
    }

    async function saveData() {
        const btn = document.getElementById('submitBtn');
        const log = {
            id: document.getElementById('displayDevID').innerText,
            name: document.getElementById('displayDevName').innerText,
            model: document.getElementById('testModel').value,
            user: document.getElementById('testerName').value,
            start: document.getElementById('startTime').value,
            end: document.getElementById('endTime').value,
            time: new Date().toLocaleString()
        };

        if(!log.model || !log.user || !log.start || !log.end) return alert("請填完所有欄位");

        btn.disabled = true;
        btn.innerText = "同步中...";

        // 1. 同步到雲端 (Google Sheets)
        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify(log)
            });
            
            // 2. 存入本機紀錄 (讓該裝置可以看到歷史)
            testLogs.push(log);
            localStorage.setItem('test_logs_v3', JSON.stringify(testLogs));

            alert("紀錄成功！已同步至雲端。");
            
            // 3. 重新整理頁面以更新紀錄顯示，但不跳轉走
            location.reload(); 
        } catch (e) {
            alert("同步失敗，請檢查網路！");
            btn.disabled = false;
            btn.innerText = "確認並送出紀錄";
        }
    }

    function renderLogs(id) {
        const content = document.getElementById('logContent');
        const filtered = testLogs.filter(l => l.id === id).reverse();
        content.innerHTML = filtered.map(l => `
            <div class="log-item">
                <strong>${l.model}</strong> - 使用者: ${l.user}<br>
                <span class="log-time">${l.start.replace('T',' ')} 至 ${l.end.replace('T',' ')}</span>
            </div>
        `).join('');
    }
</script>
</body>
</html>
