<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端同步設備管理系統</title>
    <script src="https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0.0.2/qrcode.min.js"></script>
    <style>
        :root { --primary: #007bff; --bg: #f4f7f6; --admin: #6f42c1; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card { border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        /* 管理員樣式 */
        .admin-box { border: 2px dashed var(--admin); padding: 15px; border-radius: 8px; margin-bottom: 20px; background: #f9f6ff; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; display: block; }
        input[type="datetime-local"] {
                width: 100% !important;
                max-width: 100% !important;
                box-sizing: border-box !important; /* 強制讓 padding 不外推 */
                display: block !important;
                padding: 10px;
                height: 45px;
                border: 1px solid #ddd;
                border-radius: 6px;
                font-size: 16px;
                -webkit-appearance: none; /* 移除某些手機瀏覽器的預設陰影 */
            }
        button { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-submit { background: #28a745; color: white; width: 100%; padding: 12px; }
        .btn-qr, .btn-edit {
            min-width: 60px;    /* 設定最小寬度為 60px */
            height: 36px;       /* 固定高度 */
            padding: 0 10px;    /* 移除上下內距，靠高度控制 */
            font-size: 14px;
            margin: 2px;        /* 讓兩個按鈕之間有點間距 */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            }
        .btn-qr { background: var(--primary); color: white; }
        .btn-edit { background: #ffc107; color: #212529; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: left; font-size: 14px; }

        .check-row {
            display: flex !important;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .check-label {
            flex: 1;
            font-size: 14px;
            color: #333;
            padding-right: 10px;
        }
        .check-options {
            display: flex !important;
            gap: 15px;
            flex-shrink: 0; /* 防止右側選項被壓縮 */
        }
        .check-options label {
            display: inline-flex !important;
            align-items: center !important;
            white-space: nowrap !important;
            font-size: 14px;
            cursor: pointer;
        }
        .check-options input[type="radio"] {
            width: 18px !important;
            height: 18px !important;
            margin: 0 4px 0 0 !important;
            cursor: pointer;
            /* 移除可能干擾橫排的屬性 */
            display: inline-block !important;
        }

        /* QR Code 彈窗 */
        #qrOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .qr-modal { background: white; padding: 30px; border-radius: 15px; text-align: center; max-width: 85%; }

        /* 紀錄樣式 */ 
        .log-item { background: #f8f9fa; border-left: 5px solid var(--primary); padding: 12px; margin-bottom: 10px; border-radius: 4px; }
        .log-header { font-weight: bold; color: #333; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .log-time { font-size: 12px; color: #666; }
    </style> 
</head>
<body>

<div class="container">
    <div id="adminPanel" class="admin-box hidden">
        <h3 id="adminTitle" style="color:var(--admin); margin-top:0;">🔧 設備管理清單</h3>
        <input type="text" id="devName" placeholder="輸入設備名稱">
        <input type="text" id="devID" placeholder="輸入編號 (ID)">
        <select id="devCategory" style="width:100%; padding:12px; margin-bottom:15px; border-radius:6px;">
            <option value="General chamber">General chamber</option>
            <option value="Convection chamber">Convection chamber</option>
            <option value="Vibration tester">Vibration tester</option>
            <option value="Shock tester">Shock tester</option>
            <option value="Drop tester">Drop tester</option>
        </select>
        <button id="addBtn" class="btn-submit" onclick="saveDevice()">新增設備</button>
        <button id="cancelBtn" class="hidden" style="background:#666; color:white; width:100%; margin-top:5px;" onclick="resetForm()">取消</button>
        
        <table>
            <thead><tr><th>設備資訊</th><th>操作</th></tr></thead>
            <tbody id="adminListBody"></tbody>
        </table>
    </div>

    <div id="qrOverlay" class="hidden" onclick="closeQR()">
        <div class="qr-modal" onclick="event.stopPropagation()">
            <h3 id="qrName" style="margin-top:0;"></h3>
            <div id="qrcode"></div>
            <p id="qrID" style="color:#666; font-size:14px;"></p>
            <button onclick="closeQR()" style="background:#333; color:white; width:100%; padding:10px;">關閉視窗</button>
        </div>
    </div>

    <div id="testView" class="hidden">
        <div style="border-bottom: 3px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px;">
            <h2 id="displayDevName" style="margin:0;">載入中...</h2>
            <small id="displayDevID" style="color:#666;"></small>
        </div>
        
        <div class="card">
            <input type="text" id="testModel" placeholder="機種型號(無產品請填每月檢查)">
            <input type="text" id="testerName" placeholder="使用者姓名">
            <label style="font-size:12px;">開始時間</label><input type="datetime-local" id="startTime"><br>
            <div id="endTimeWrapper">
                <label style="font-size:12px;">結束時間</label>
                <input type="datetime-local" id="endTime">
            </div>
            
            <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
                <div id="checkItems">
                    <h4 style="margin-bottom: 10px; color: #333;">📋 設備點檢項目</h4>
                    <div id="normalChecks"></div>
                </div>
                
                <div id="dropInputs" class="hidden" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
                <h4 style="margin-bottom: 10px; color: #admin;">Drop data</h4>
                <input type="number" id="dropL" placeholder="Length (mm)">
                <input type="number" id="dropW" placeholder="Width (mm)">
                <input type="number" id="dropH" placeholder="Height (mm)">
                <input type="number" id="dropWeight" placeholder="Weight (kg)">
                <input type="number" id="dropHeight" placeholder="Drop height (mm)">
                </div>
            </div> 
            <button id="submitBtn" class="btn-submit" onclick="saveToLog()">確認送出紀錄</button>
        </div>

        <div class="log-list">
            <h3>📊 本月紀錄</h3>
            <div id="logContent"><p style="text-align:center; color:#999;">正在連線雲端資料庫...</p></div>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbf4xh7ylwM52Evsv06gFIRe8oToHi_zyuYpXkMlgTlme6YSxOKBn7HkwQBwCALP0/exec"; 
    const ADMIN_PASSWORD = "admin";

window.onload = async function() {
    const params = new URLSearchParams(window.location.search);
    const isAdmin = params.get('mode') === ADMIN_PASSWORD;
    const id = params.get('id');

    if (isAdmin) {
        document.getElementById('adminPanel').classList.remove('hidden');
        refreshAdminList();
    }
    
    if (id) {
        showTestPage(id);
    }
};

// --- 工具函數 ---
function getPhoneID() {
    let phoneID = localStorage.getItem('my_device_id');
    if (!phoneID) {
        phoneID = 'P-' + Math.floor(Math.random() * 1000000);
        localStorage.setItem('my_device_id', phoneID);
    }
    return phoneID;
}

function getNowStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// 補上之前缺失的 formatForInput
function formatForInput(date) {
    const d = new Date(date);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const hours = String(d.getHours()).padStart(2, '0');
    const minutes = String(d.getMinutes()).padStart(2, '0');
    return `${year}-${month}-${day}T${hours}:${minutes}`;
}

// --- 管理員函數 ---
const CHECK_CONFIG = {
    "General chamber": ["1. 電源是否正常？(Input V ± 10%)", "2. 水槽及水位器，水位是否正常？", "3. 感濕棉布是否潔淨，吸水性是否良好？", "4. 溼度保護器是否設定於 130℃~150℃ 間？", "5. 蒸餾水是否足夠？", "6. 環境溫溼度是否合乎規定？"],
    "Convection chamber": ["1. 電源是否正常？(230VAC±10%)", "2. 環境溫度是否合乎規定？"],
    "Vibration tester": ["1. 確認空壓機油量是否足夠？", "2. Shaker冷卻風扇是否正常運作？", "3. 確認空壓系統運作正常？", "4. Shaker氣囊充氣是否足夠？", "5. 溫機10分鐘？"],
    "Shock tester": ["1. 確認氣壓瓶內壓力量是否足夠？", "2. 檢查氣壓式彈簧氣墊是否異常？", "3. 確認機台是否水平？", "4. 確認電源開關、近接開關、E.M.G.按鈕是否異常？", "5. 不相關物品不要放置於輔助平台上。"]
};

async function refreshAdminList() {
    try {
        const res = await fetch(GOOGLE_SCRIPT_URL + "?type=list");
        const data = await res.json();
        const body = document.getElementById('adminListBody');
        const rows = data.slice(1).filter(r => r[0]); 
        body.innerHTML = rows.map(r => `
            <tr>
                <td><strong>${r[1]}</strong><br><small>ID: ${r[0]}</small><br><span style="font-size:11px; background:#e9ecef; padding:2px 5px; border-radius:4px;">${r[2] || '未設定'}</span></td>
                <td><button class="btn-qr" onclick="makeQR('${r[0]}', '${r[1]}')">QR</button><button class="btn-edit" onclick="fillForm('${r[0]}', '${r[1]}', '${r[2]}')">修改</button></td>
            </tr>`).join('');
    } catch (e) { console.error("抓取失敗", e); }
}

async function saveDevice() {
    const id = document.getElementById('devID').value.trim();
    const name = document.getElementById('devName').value.trim();
    const category = document.getElementById('devCategory').value;
    if(!id || !name) return alert("請填寫編號與名稱");
    await fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "saveDevice", id: id, name: name, category: category })});
    alert("設備已更新！");
    location.reload();
}

function fillForm(id, name, category) {
    document.getElementById('devID').value = id;
    document.getElementById('devName').value = name;
    document.getElementById('devCategory').value = category || "General chamber";
    document.getElementById('adminTitle').innerText = "✏️ 編輯設備";
    document.getElementById('addBtn').innerText = "儲存修改";
    document.getElementById('cancelBtn').classList.remove('hidden');
}

function resetForm() {
    document.getElementById('devID').value = '';
    document.getElementById('devName').value = '';
    document.getElementById('adminTitle').innerText = "🔧 設備管理清單";
    document.getElementById('addBtn').innerText = "新增設備";
    document.getElementById('cancelBtn').classList.add('hidden');
}

function makeQR(id, name) {
    document.getElementById('qrcode').innerHTML = "";
    const url = window.location.origin + window.location.pathname + "?id=" + encodeURIComponent(id);
    new QRCode(document.getElementById('qrcode'), { text: url, width: 200, height: 200 });
    document.getElementById('qrName').innerText = name;
    document.getElementById('qrID').innerText = "ID: " + id;
    document.getElementById('qrOverlay').classList.remove('hidden');
}

function closeQR() { document.getElementById('qrOverlay').classList.add('hidden'); }

// --- 使用者點檢頁面函數 ---
async function showTestPage(id) {
    document.getElementById('testView').classList.remove('hidden');
    document.getElementById('displayDevID').innerText = "編號：" + id;
    document.getElementById('startTime').value = getNowStr();
    document.getElementById('endTime').value = getNowStr();

    try {
        const res = await fetch(GOOGLE_SCRIPT_URL + "?type=list");
        const list = await res.json();
        const dev = list.slice(1).find(r => r[0].toString() === id.toString());
        
        if (dev) {
            const category = dev[2] || "General chamber";
            window.currentCategory = category;
            document.getElementById('displayDevName').innerText = dev[1];

            if (category === "Drop tester") {
                document.getElementById('dropInputs').classList.remove('hidden');
                document.getElementById('checkItems').classList.add('hidden');
            } else {
                document.getElementById('dropInputs').classList.add('hidden');
                document.getElementById('checkItems').classList.remove('hidden');
                const items = CHECK_CONFIG[category] || [];
                document.getElementById('checkItems').innerHTML = items.map((text, i) => `
                    <div class="check-row">
                        <div class="check-label">${text}</div>
                        <div class="check-options">
                            <label><input type="radio" name="q${i}" value="正常" checked> <span>正常</span></label>
                            <label><input type="radio" name="q${i}" value="異常"> <span>異常</span></label>
                        </div>
                    </div>`).join('');

                // 檢查是否有未結束紀錄 (只對非落摔設備檢查)
                const resLogs = await fetch(`${GOOGLE_SCRIPT_URL}?category=${encodeURIComponent(category)}`);
                const logs = await resLogs.json();
                const myPhoneID = getPhoneID();
                const unfinished = logs.slice(1).reverse().find(r => r[0].toString() === id.toString() && (!r[5] || r[5] === "") && r[6] === myPhoneID);

                if (unfinished) {
                    alert("自動帶入上次未完成資料。");
                    document.getElementById('testModel').value = unfinished[2];
                    document.getElementById('testerName').value = unfinished[3];
                    document.getElementById('startTime').value = formatForInput(unfinished[4]);
                    document.getElementById('endTime').value = getNowStr();
                }
            }
            fetchCloudLogs(id, category); 
        }
    } catch (e) { console.error("載入測試頁面出錯", e); }
}

async function fetchCloudLogs(id, category) {
    const content = document.getElementById('logContent');
    try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?category=${encodeURIComponent(category)}`);
        const data = await res.json();
        const now = new Date();
        const rows = data.slice(1).filter(r => {
            const logDate = new Date(r[4]);
            return r[0].toString() === id.toString() && logDate.getFullYear() === now.getFullYear() && logDate.getMonth() === now.getMonth();
        }).reverse();
        
        if(rows.length === 0) {
            content.innerHTML = `<p style='text-align:center; color:#999;'>本月尚無紀錄</p>`;
            return;
        }

        content.innerHTML = rows.map(r => `
            <div class="log-item">
                <div class="log-header"><span>機種: ${r[2]}</span><span>使用者: ${r[3]}</span></div>
                <div class="log-time">時段: ${r[4]} ～ ${r[5]}</div>
            </div>`).join('');
    } catch (e) { content.innerHTML = "<p style='text-align:center; color:red;'>紀錄載入失敗</p>"; }
}

async function saveToLog() {
    const cleanId = document.getElementById('displayDevID').innerText.replace("編號：", "").trim();
    const cleanName = document.getElementById('displayDevName').innerText;
    const category = window.currentCategory;
    let checksArray = [];

    if (category === "Drop tester") {
        checksArray = [
            document.getElementById('dropL').value || "0",
            document.getElementById('dropW').value || "0",
            document.getElementById('dropH').value || "0",
            document.getElementById('dropWeight').value || "0",
            document.getElementById('dropHeight').value || "0"
        ];
    } else {
        const itemsCount = (CHECK_CONFIG[category] || []).length;
        for (let i = 0; i < itemsCount; i++) {
            const radio = document.querySelector(`input[name="q${i}"]:checked`);
            checksArray.push(radio ? radio.value : "N/A");
        }
    }

    const logData = {
        action: "saveLog",
        phoneId: getPhoneID(),
        category: category,
        id: cleanId,
        name: cleanName,
        model: document.getElementById('testModel').value.trim(),
        user: document.getElementById('testerName').value.trim(),
        start: document.getElementById('startTime').value,
        end: document.getElementById('endTime').value,
        checks: checksArray
    };

    if (!logData.model || !logData.user || !logData.start) return alert("請填寫完整資訊");

    const btn = document.getElementById('submitBtn');
    btn.innerText = "傳送中...";
    btn.disabled = true;

    try {
        await fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(logData) });
        alert("✅ 紀錄存入雲端！");
        location.reload();
    } catch (e) {
        alert("傳送失敗");
        btn.disabled = false;
        btn.innerText = "確認送出紀錄";
    }
}
</script>
</body>
</html>
