<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端同步設備管理系統</title>
    <script src="https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0.0.2/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --primary: #007bff; --bg: #f4f7f6; --admin: #6f42c1; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card { border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        .admin-box { border: 2px dashed var(--admin); padding: 15px; border-radius: 8px; margin-bottom: 20px; background: #f9f6ff; }
        input, select { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 12px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px; 
            display: block;
        }
        label { font-size: 12px; color: #666; display: block; margin-bottom: 4px; }
        
        input[type="datetime-local"] {
            width: 100% !important; 
            max-width: 220px !important;    
            flex-grow: 1;
            margin-bottom: 15px;
            padding: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
            height: 38px;
        }
        
        button { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-submit { background: #28a745; color: white; width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; }
        .btn-qr { background: var(--primary); color: white; }
        .btn-export { background: #6f42c1; color: white; padding: 6px 12px; font-size: 13px; border-radius: 4px; height: 38px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: left; font-size: 14px; }

        .check-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 0; 
            border-bottom: 1px solid #eee;
            gap: 10px; 
        }
        
        .check-label { 
            flex: 1; 
            font-size: 14px; 
            color: #333; 
            line-height: 1.3;
            word-break: break-all;
        }
        .check-options { 
            display: flex; 
            gap: 12px; 
            flex-shrink: 0; 
        }
        .check-options label { 
            display: flex !important; 
            align-items: center !important; 
            margin-bottom: 0; 
            font-size: 14px; 
            white-space: nowrap; 
            cursor: pointer;
        }

        .check-options input[type="radio"] { 
            width: 18px !important; 
            height: 18px !important; 
            margin: 0 4px 0 0 !important; 
            flex-shrink: 0;
        }

        .collapsible {
            background-color: #eee;
            color: #444;
            cursor: pointer;
            padding: 12px;
            width: 100%;
            border: none;
            text-align: left;
            outline: none;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .active, .collapsible:hover { background-color: #ddd; }
        .collapsible:after { content: '\002B'; font-weight: bold; float: right; }
        .active:after { content: "\2212"; }
        
        .content {
            padding: 0 15px;
            display: none;
            overflow: hidden;
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 0 0 6px 6px;
        }
        .g-input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 15px 0;
        }
        .g-input-grid input { margin-bottom: 5px !important; }
        
        #qrOverlay, #scannerOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .qr-modal { background: white; padding: 30px; border-radius: 15px; text-align: center; max-width: 85%; }

        .log-item { background: #f8f9fa; border-left: 5px solid var(--primary); padding: 12px; margin-bottom: 10px; border-radius: 4px; }
        .log-header { font-weight: bold; color: #333; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .log-time-row { font-size: 13px; color: #666; margin-top: 3px; display: flex; gap: 6px; }
        .time-tag { font-weight: bold; }

        .scanner-container { width: 300px; background: white; padding: 15px; border-radius: 12px; text-align: center; }
        #reader { width: 100%; }
        
        .id-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }
        .export-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }
    </style> 
</head>
<body>

<div class="container">
    <div id="adminPanel" class="admin-box hidden">
        <h3 id="adminTitle" style="color:var(--admin); margin-top:0;">🔧 設備管理清單</h3>
        <input type="text" id="devName" placeholder="輸入設備名稱">
        <input type="text" id="devID" placeholder="輸入編號 (ID)">
        <select id="devCategory">
            <option value="General chamber">General chamber</option>
            <option value="Convection chamber">Convection chamber</option>
            <option value="Vibration tester">Vibration tester</option>
            <option value="Shock tester">Shock tester</option>
            <option value="Drop tester">Drop tester</option>
        </select>
        <button id="addBtn" class="btn-submit" onclick="saveDevice()">新增設備</button>
        <button id="cancelBtn" class="hidden" style="background:#666; color:white; width:100%; margin-top:5px;" onclick="resetForm()">取消</button>
        <table>
            <thead><tr><th>設備資訊</th><th>操作</th></tr></thead>
            <tbody id="adminListBody"></tbody>
        </table>
    </div>

    <div id="qrOverlay" class="hidden" onclick="closeQR()">
        <div class="qr-modal" onclick="event.stopPropagation()">
            <div id="qrcode" style="display: flex; justify-content: center; margin-bottom: 15px;"></div>
            <h3 id="qrName" style="margin: 5px 0;"></h3>
            <p id="qrID" style="color:#666; margin-bottom: 15px;"></p>
            <button onclick="closeQR()" style="background:#333; color:white; width:100%;">關閉</button>
        </div>
    </div>

    <div id="scannerOverlay" class="hidden">
        <div class="scanner-container">
            <h4 style="margin-top:0; margin-bottom:10px;">請對準 QR Code 掃描</h4>
            <div id="reader"></div>
            <button onclick="stopScanner()" style="background:#dc3545; color:white; width:100%; margin-top:10px;">取消掃描</button>
        </div>
    </div>

    <div id="testView" class="hidden">
        <h2 id="displayDevName" style="margin-bottom: 5px;">載入中...</h2>
        
        <!-- ID 欄位與月份選擇器、匯出按鈕 -->
        <div class="id-row">
            <small id="displayDevID" style="color:#666; font-size:14px;"></small>
            <div id="exportContainer" class="export-group hidden">
                <input type="month" id="exportMonthInput" style="margin-bottom:0; width:auto; padding:6px; font-size:14px; height:38px;">
                <button id="exportBtn" class="btn-export" onclick="handleExportPDF()">匯出 PDF</button>
            </div>
        </div>
        
        <div class="card">
            <label>IDesign No.</label>
            <div style="display: flex; gap: 6px; margin-bottom: 12px;">
                <input type="text" id="idesignNo" placeholder="請輸入 IDesign No." style="margin-bottom: 0;">
                <button type="button" class="btn-qr" style="white-space: nowrap; padding: 0 12px;" onclick="startScanner()">掃描 QR</button>
            </div>

            <label>機種型號</label>
            <input type="text" id="testModel" placeholder="機種型號">
            
            <label>使用者姓名</label>
            <input type="text" id="testerName" placeholder="使用者姓名">
            
            <label>測試項目</label>
            <input type="text" id="workItemSelect" placeholder="請輸入測試項目">

            <label>開始時間</label>
            <input type="datetime-local" id="startTime">
            
            <div id="endTimeWrapper">
                <label>結束時間</label>
                <input type="datetime-local" id="endTime">
            </div>
            
            <div id="checkItems">
                <h4 style="margin-bottom: 10px;">📋 點檢項目</h4>
                <div id="normalChecks"></div>
            </div>

            <div id="dropInputs" class="hidden">
                <h4 style="margin-bottom: 10px;">📦 Drop Data</h4>
                <input type="number" id="dropL" placeholder="Length (mm)">
                <input type="number" id="dropW" placeholder="Width (mm)">
                <input type="number" id="dropH" placeholder="Height (mm)">
                <input type="number" id="dropWeight" placeholder="Weight (kg)">
                <input type="number" id="dropHeight" placeholder="Drop height (mm)">

                <button type="button" class="collapsible" onclick="toggleCollapsible(this)">加速規數值錄入 (g)</button>
                <div class="content">
                    <div class="g-input-grid">
                        <input type="number" id="g_corner" placeholder="Corner">
                        <input type="number" id="g_short_e" placeholder="Short edge">
                        <input type="number" id="g_mid_e" placeholder="Mid edge">
                        <input type="number" id="g_long_e" placeholder="Long edge">
                        <input type="number" id="g_small_f" placeholder="Small face">
                        <input type="number" id="g_opp_small_f" placeholder="Oppsite small f.">
                        <input type="number" id="g_mid_f" placeholder="Mid face">
                        <input type="number" id="g_opp_mid_f" placeholder="Oppsite mid f.">
                        <input type="number" id="g_large_f" placeholder="Large face">
                        <input type="number" id="g_opp_large_s" placeholder="Oppsite large s.">      
                    </div>
                </div>             
            </div>
            
            <button id="submitBtn" class="btn-submit" onclick="saveToLog()">確認送出紀錄</button>
        </div>

        <div class="log-list">
            <h3>📊 本月紀錄</h3>
            <div id="logContent">載入中...</div>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzNzFEmFCfMrGRGRRdRMpSIIyMkEnXupSYcvPD3lAIu169xyoCJ5FciOLyBNpPkWpA/exec";
    const ADMIN_PASSWORD = "admin";
    const CHECK_CONFIG = {
        "General chamber": ["電源是否正常？(Input V ± 10%)", "水槽及水位器，水位是否正常？", "感濕棉布是否潔淨，吸水性是否良好？", "溼度保護器是否設定於 130℃~150℃ 間？", "蒸餾水是否足夠？", "環境溫溼度是否合乎規定？"],
        "Convection chamber": ["電源是否正常？(230VAC±10%)", "環境溫度是否合乎規定？"],
        "Vibration tester": ["環境溫度是否合乎規定？", "Shaker冷卻風扇是否正常運作？", "確認空壓系統運作正常？", "Shaker氣囊充氣是否足夠？", "溫機10分鐘？"],
        "Shock tester": ["確認氣壓瓶內壓力量是否足夠？", "檢查氣壓式彈簧氣墊是否異常？", "確認機台是否水平？", "確認電源開關、近接開關、E.M.G.按鈕是否異常？", "不相關物品不要放置於輔助平台上，以免影響測試。"]
    };

    let html5QrCode = null;

    window.onload = async function() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('mode') === ADMIN_PASSWORD) {
            document.getElementById('adminPanel').classList.remove('hidden');
            refreshAdminList();
        }
        const id = params.get('id');
        if (id) showTestPage(id);

        const now = new Date();
        const defaultYearMonth = `${now.getFullYear()}-${(now.getMonth() + 1).toString().padStart(2, '0')}`;
        const monthInput = document.getElementById('exportMonthInput');
        if (monthInput) monthInput.value = defaultYearMonth;
    };

    function startScanner() {
        document.getElementById('scannerOverlay').classList.remove('hidden');
        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 200, height: 200 } },
            (decodedText) => {
                document.getElementById('idesignNo').value = decodedText;
                stopScanner();
            },
            (errorMessage) => { }
        ).catch(err => {
            alert("無法啟動相機: " + err);
            stopScanner();
        });
    }

    function stopScanner() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().then(() => {
                document.getElementById('scannerOverlay').classList.add('hidden');
            }).catch(err => {
                console.error("Stop scanner error:", err);
                document.getElementById('scannerOverlay').classList.add('hidden');
            });
        } else {
            document.getElementById('scannerOverlay').classList.add('hidden');
        }
    }

    function toggleCollapsible(btn) {
        btn.classList.toggle("active");
        var content = btn.nextElementSibling;
        content.style.display = (content.style.display === "block") ? "none" : "block";
    }
    
    function getNowStr() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const h = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        
        return `${y}-${m}-${d}T${h}:${min}`;
    }

    function getPhoneID() {
        let id = localStorage.getItem('my_device_id');
        if (!id) {
            id = 'P-' + Math.floor(Math.random() * 1000000);
            localStorage.setItem('my_device_id', id);
        }
        return id;
    }

    function formatForInput(date) {
        const d = new Date(date);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    async function refreshAdminList() {
        const res = await fetch(GOOGLE_SCRIPT_URL + "?type=list");
        const data = await res.json();
        document.getElementById('adminListBody').innerHTML = data.slice(1).map(r => `
            <tr>
                <td>${r[1]}<br><small>ID=${r[0]}</small></td>
                <td><button class="btn-qr" onclick="makeQR('${r[0]}','${r[1]}')">QR</button></td>
            </tr>`).join('');
    }

    async function saveDevice() {
        const id = document.getElementById('devID').value;
        const name = document.getElementById('devName').value;
        const cat = document.getElementById('devCategory').value;
        await fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "saveDevice", id, name, category: cat })});
        location.reload();
    }

    function makeQR(id, name) {
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById('qrcode'), window.location.origin + window.location.pathname + "?id=" + id);
        document.getElementById('qrName').innerText = name;
        document.getElementById('qrID').innerText = "ID: " + id;
        document.getElementById('qrOverlay').classList.remove('hidden');
    }

    function closeQR() { document.getElementById('qrOverlay').classList.add('hidden'); }

    async function showTestPage(id) {
        document.getElementById('testView').classList.remove('hidden');
        document.getElementById('displayDevID').innerText = "ID: " + id;
        document.getElementById('startTime').value = getNowStr();

        const res = await fetch(GOOGLE_SCRIPT_URL + "?type=list");
        const list = await res.json();
        const dev = list.find(r => r[0].toString() === id.toString());
        
        if (dev) {
            const category = dev[2];
            window.currentCategory = category;
            document.getElementById('displayDevName').innerText = dev[1];
            
            document.getElementById('exportContainer').classList.remove('hidden');

            if (category === "Drop tester") {
                document.getElementById('dropInputs').classList.remove('hidden');
                document.getElementById('checkItems').classList.add('hidden');
                document.getElementById('endTimeWrapper').classList.add('hidden');
                // 針對 Drop tester 隱藏月份選擇器，僅保留匯出按鈕
                document.getElementById('exportMonthInput').classList.add('hidden');
            } else {
                document.getElementById('dropInputs').classList.add('hidden');
                document.getElementById('checkItems').classList.remove('hidden');
                document.getElementById('endTimeWrapper').classList.remove('hidden');
                // 針對其他 Chamber 顯示月份選擇器
                document.getElementById('exportMonthInput').classList.remove('hidden');

                const items = CHECK_CONFIG[category] || [];
                document.getElementById('normalChecks').innerHTML = items.map((t, i) => `
                    <div class="check-row"><span class="check-label">${t}</span>
                    <div class="check-options">
                        <label><input type="radio" name="q${i}" value="正常" checked> 正常</label>
                        <label><input type="radio" name="q${i}" value="異常"> 異常</label>
                    </div></div>`).join('');
                
                const resLogs = await fetch(`${GOOGLE_SCRIPT_URL}?category=${encodeURIComponent(category)}`);
                const logs = await resLogs.json();
                
                const todayStr = new Date().toISOString().split('T')[0];
                const unfinished = logs.slice(1).reverse().find(r => {
                    if (r[0].toString() === id.toString() && !r[7] && r[8] === getPhoneID() && r[6]) {
                        return r[6].toString().startsWith(todayStr);
                    }
                    return false;
                });

                if (unfinished) {
                    document.getElementById('idesignNo').value = unfinished[2] || '';
                    document.getElementById('workItemSelect').value = unfinished[3] || '';
                    document.getElementById('testModel').value = unfinished[4] || '';
                    document.getElementById('testerName').value = unfinished[5] || '';
                    document.getElementById('startTime').value = formatForInput(unfinished[6]);
                    document.getElementById('endTime').value = getNowStr();
                    document.getElementById('endTime').style.border = "2px solid red";
                }
            }
            fetchCloudLogs(id, category);
        }
    }

    function handleExportPDF() {
        if (window.currentCategory === "Drop tester") {
            exportDropPDF();
        } else {
            exportChamberPDF();
        }
    }

    async function exportDropPDF() {
        const printArea = document.createElement('div');
        printArea.style.padding = '20px';
        printArea.style.background = '#fff';
        printArea.style.width = '700px';
        printArea.style.fontFamily = 'Microsoft JhengHei, sans-serif';
        printArea.style.position = 'relative';

        const v = (id) => document.getElementById(id) ? document.getElementById(id).value : '';
        const rawStart = v('startTime');
        const startDateOnly = rawStart ? rawStart.split('T')[0] : '';

        printArea.innerHTML = `
            <h2 style="text-align:center; margin-bottom:20px;">實驗室測試資料記錄表</h2>
            <table style="width:100%; border-collapse:collapse; margin-bottom:15px; font-size:14px;">
                <tr>
                    <td style="padding:6px; font-weight:bold; width:18%;">設備名稱:</td><td style="width:32%;">${document.getElementById('displayDevName').innerText}</td>
                    <td style="padding:6px; font-weight:bold; width:18%;">IDesign No:</td><td style="width:32%;">${v('idesignNo')}</td>
                </tr>
                <tr>
                    <td style="padding:6px; font-weight:bold;">機種型號:</td><td>${v('testModel')}</td>
                    <td style="padding:6px; font-weight:bold;">測試人員:</td><td>${v('testerName')}</td>
                </tr>
                <tr>
                    <td style="padding:6px; font-weight:bold;">測試項目:</td><td>${v('workItemSelect')}</td>
                    <td style="padding:6px; font-weight:bold;">開始日期:</td><td>${startDateOnly}</td>
                </tr>
            </table>
            
            <h3 style="margin-top:15px; border-bottom:2px solid #007bff; padding-bottom:5px;">尺寸/重量數據</h3>
            <table border="1" style="width:100%; border-collapse:collapse; text-align:center; font-size:13px; margin-bottom:20px;">
                <tr style="background:#f2f2f2;"><th>項目</th><th>數值</th><th>項目</th><th>數值</th></tr>
                <tr><td>Length (mm)</td><td>${v('dropL')}</td><td>Width (mm)</td><td>${v('dropW')}</td></tr>
                <tr><td>Height (mm)</td><td>${v('dropH')}</td><td>Weight (kg)</td><td>${v('dropWeight')}</td></tr>
                <tr><td>Drop Height (mm)</td><td>${v('dropHeight')}</td><td>-</td><td>-</td></tr>
            </table>

            <h3 style="margin-top:15px; border-bottom:2px solid #007bff; padding-bottom:5px;">加速規 (g) 數據</h3>
            <table border="1" style="width:100%; border-collapse:collapse; text-align:center; font-size:13px; margin-bottom:25px;">
                <tr style="background:#f2f2f2;"><th>方向</th><th>g 值</th><th>方向</th><th>g 值</th></tr>
                <tr><td>Corner</td><td>${v('g_corner')}</td><td>Short Edge</td><td>${v('g_short_e')}</td></tr>
                <tr><td>Mid Edge</td><td>${v('g_mid_e')}</td><td>Long Edge</td><td>${v('g_long_e')}</td></tr>
                <tr><td>Small Face</td><td>${v('g_small_f')}</td><td>Opposite Small Face</td><td>${v('g_opp_small_f')}</td></tr>
                <tr><td>Mid Face</td><td>${v('g_mid_f')}</td><td>Opposite Mid Face</td><td>${v('g_opp_mid_f')}</td></tr>
                <tr><td>Large Face</td><td>${v('g_large_f')}</td><td>Opposite Large Side</td><td>${v('g_opp_large_s')}</td></tr>
            </table>

            <div style="text-align:right; font-size:12px; color:#888; margin-top:10px;">QAL-003-F03</div>
        `;

        document.body.appendChild(printArea);
        const canvas = await html2canvas(printArea, { scale: 2 });
        const imgData = canvas.toDataURL('image/png');
        
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const imgProps = pdf.getImageProperties(imgData);
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

        pdf.addImage(imgData, 'PNG', 0, 10, pdfWidth, pdfHeight);
        document.body.removeChild(printArea);

        pdf.save(`Drop_Test_Report_${v('idesignNo') || 'Record'}.pdf`);
    }

    async function exportChamberPDF() {
        const devName = document.getElementById('displayDevName').innerText;
        const category = window.currentCategory;
        
        const selectedMonthVal = document.getElementById('exportMonthInput').value;
        let exportYear, exportMonthNum, currentMonthFilter;
        if (selectedMonthVal) {
            const parts = selectedMonthVal.split('-');
            exportYear = parseInt(parts[0], 10);
            exportMonthNum = parseInt(parts[1], 10);
            currentMonthFilter = selectedMonthVal;
        } else {
            const now = new Date();
            exportYear = now.getFullYear();
            exportMonthNum = now.getMonth() + 1;
            currentMonthFilter = `${exportYear}-${exportMonthNum.toString().padStart(2, '0')}`;
        }

        let rowsData = [];
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?category=${encodeURIComponent(category)}`);
            const data = await res.json();
            rowsData = data.slice(1).filter(r => {
                if (!r[6]) return false;
                return r[0].toString() === document.getElementById('displayDevID').innerText.replace("ID: ", "").toString() && r[6].toString().startsWith(currentMonthFilter);
            });
        } catch (e) {
            alert("載入指定月份資料失敗，無法產生 PDF");
            return;
        }

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');

        const printArea1 = document.createElement('div');
        printArea1.style.padding = '20px';
        printArea1.style.background = '#fff';
        printArea1.style.width = '750px';
        printArea1.style.fontFamily = 'Microsoft JhengHei, sans-serif';
        printArea1.style.position = 'relative';

        const rawFormat = (val) => val ? val.toString().replace('T', ' ').substring(0, 16) : '';

        let tableRowsHTML1 = '';
        if (rowsData.length === 0) {
            tableRowsHTML1 = `<tr><td colspan="5" style="text-align:center; padding:15px; color:#999;">選擇的月份尚無使用紀錄</td></tr>`;
        } else {
            tableRowsHTML1 = rowsData.map(r => `
                <tr>
                    <td style="padding:8px; border:1px solid #333;">${r[2] || '---'}</td>
                    <td style="padding:8px; border:1px solid #333;">${r[4] || '---'}</td>
                    <td style="padding:8px; border:1px solid #333;">${rawFormat(r[6])}</td>
                    <td style="padding:8px; border:1px solid #333;">${rawFormat(r[7]) || '進行中'}</td>
                    <td style="padding:8px; border:1px solid #333;">${r[5] || '---'}</td>
                </tr>
            `).join('');
        }

        printArea1.innerHTML = `
            <div style="border-bottom:2px solid #333; padding-bottom:8px; margin-bottom:15px; text-align:center;">
                <h2 style="margin:0;">${devName}   ${exportMonthNum} 月使用紀錄表 (${exportYear})</h2>
            </div>
            
            <table style="width:100%; border-collapse:collapse; text-align:center; font-size:13px; border:1px solid #333; margin-bottom:20px;">
                <thead>
                    <tr style="background:#e9ecef;">
                        <th style="padding:8px; border:1px solid #333; width:20%;">IDesign No.</th>
                        <th style="padding:8px; border:1px solid #333; width:28%;">測試機種</th>
                        <th style="padding:8px; border:1px solid #333; width:22%;">啟始時間</th>
                        <th style="padding:8px; border:1px solid #333; width:22%;">結束時間</th>
                        <th style="padding:8px; border:1px solid #333; width:12%;">使用者</th>
                    </tr>
                </thead>
                <tbody>
                    ${tableRowsHTML1}
                </tbody>
            </table>
            
            <div style="text-align:right; font-size:12px; color:#888; margin-top:10px;">QAL-006-F04 RE.A0</div>
        `;

        document.body.appendChild(printArea1);
        const canvas1 = await html2canvas(printArea1, { scale: 2 });
        const imgData1 = canvas1.toDataURL('image/png');
        const imgProps1 = pdf.getImageProperties(imgData1);
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight1 = (imgProps1.height * pdfWidth) / imgProps1.width;
        pdf.addImage(imgData1, 'PNG', 0, 10, pdfWidth, pdfHeight1);
        document.body.removeChild(printArea1);

        pdf.addPage();

        const printArea2 = document.createElement('div');
        printArea2.style.padding = '20px';
        printArea2.style.background = '#fff';
        printArea2.style.width = '1000px';
        printArea2.style.fontFamily = 'Microsoft JhengHei, sans-serif';
        printArea2.style.position = 'relative';

        const configItems = CHECK_CONFIG[category] || [];
        const allItems = [...configItems, "檢查人簽名"];

        let dateHeaders = '';
        for (let d = 1; d <= 31; d++) {
            dateHeaders += `<th style="border:1px solid #333; padding:4px; font-size:10px; text-align:center; width:22px;">${d}</th>`;
        }

        let tableRowsHTML2 = '';
        allItems.forEach((itemText, index) => {
            let dayCells = '';
            for (let d = 1; d <= 31; d++) {
                let hasCheck = '';
                rowsData.forEach(r => {
                    if (r[6]) {
                        const rDate = new Date(r[6]);
                        if (rDate.getFullYear() === exportYear && (rDate.getMonth() + 1) === exportMonthNum && rDate.getDate() === d) {
                            const checkStatus = r[9 + index];
                            if (checkStatus === "異常") {
                                hasCheck = "X";
                            } else if (checkStatus === "正常" || !hasCheck) {
                                hasCheck = "V";
                            }
                        }
                    }
                });
                dayCells += `<td style="border:1px solid #333; text-align:center; font-size:12px; height:28px; font-weight:bold; color:${hasCheck === 'X' ? 'red' : '#333'};">${hasCheck}</td>`;
            }

            tableRowsHTML2 += `
                <tr>
                    <td style="border:1px solid #333; padding:8px; font-size:12px; width:280px; word-break:break-all;">${index + 1}. ${itemText}</td>
                    ${dayCells}
                </tr>
            `;
        });

        printArea2.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; font-size:18px; font-weight:bold;">
                <div>${exportMonthNum} 月 實驗室設備開機前注意事項查檢表 (${category})</div>
                <div>${devName}</div>
            </div>
            
            <table style="width:100%; border-collapse:collapse; border:1px solid #333;">
                <thead>
                    <tr style="background:#e9ecef;">
                        <th style="border:1px solid #333; padding:8px; font-size:12px; text-align:center;">Item \\ Date</th>
                        ${dateHeaders}
                    </tr>
                </thead>
                <tbody>
                    ${tableRowsHTML2}
                </tbody>
            </table>
            
            <div style="text-align:right; font-size:12px; color:#888; margin-top:15px;">QAL-006-F04 RE.A0</div>
        `;

        document.body.appendChild(printArea2);
        const canvas2 = await html2canvas(printArea2, { scale: 2 });
        const imgData2 = canvas2.toDataURL('image/png');
        const imgProps2 = pdf.getImageProperties(imgData2);
        const pdfHeight2 = (imgProps2.height * pdfWidth) / imgProps2.width;
        pdf.addImage(imgData2, 'PNG', 0, 10, pdfWidth, pdfHeight2);
        document.body.removeChild(printArea2);

        pdf.save(`${devName}_${exportYear}年${exportMonthNum}月使用紀錄與查檢表.pdf`);
    }

    async function fetchCloudLogs(id, cat) {
        const content = document.getElementById('logContent');
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?category=${encodeURIComponent(cat)}`);
            const data = await res.json();
            
            const now = new Date();
            const currentMonthStr = `${now.getFullYear()}-${(now.getMonth() + 1).toString().padStart(2, '0')}`;

            const rows = data.slice(1).filter(r => {
                if (!r[6]) return false;
                return r[0].toString() === id.toString() && r[6].toString().startsWith(currentMonthStr);
            }).reverse();

            if (rows.length === 0) {
                content.innerHTML = "<p style='text-align:center; color:#999; font-size:14px;'>本月尚無紀錄</p>";
                return;
            }

            content.innerHTML = rows.map(r => {
                const rawFormat = (val) => {
                    if (!val) return null;
                    return val.toString().replace('T', ' ').substring(0, 16);
                };

                const startTime = rawFormat(r[6]) || '---';
                const endTime = rawFormat(r[7]) || '<span style="color:#dc3545; font-weight:bold;">進行中</span>';
                
                const isDropTester = (cat === "Drop tester");
                const endTimeHTML = isDropTester ? '' : `
                    <div class="log-time-row">
                        <span class="time-tag">終:</span>
                        <span class="time-val">${endTime}</span>
                    </div>`;

                return `
                    <div class="log-item">
                        <div class="log-header">
                            <span>機種: ${r[4]}</span>
                            <span style="font-weight:normal; color:#666;">使用者: ${r[5]}</span>
                        </div>
                        <div class="log-body">
                            <div class="log-time-row">
                                <span class="time-tag">始:</span>
                                <span class="time-val">${startTime}</span>
                            </div>
                            ${endTimeHTML} 
                        </div>
                    </div>`;
            }).join('');
        } catch (e) {
            content.innerHTML = "<p style='text-align:center; color:red;'>紀錄載入失敗</p>";
        }
    }

    async function saveToLog() {
        const category = window.currentCategory;
        let checksArray = [];
        
        if (category === "Drop tester") {
            checksArray = [
                document.getElementById('dropL').value,
                document.getElementById('dropW').value,
                document.getElementById('dropH').value,
                document.getElementById('dropWeight').value,
                document.getElementById('dropHeight').value,
                document.getElementById('g_corner').value,
                document.getElementById('g_short_e').value,
                document.getElementById('g_mid_e').value,
                document.getElementById('g_long_e').value,
                document.getElementById('g_small_f').value,
                document.getElementById('g_opp_small_f').value,
                document.getElementById('g_mid_f').value,
                document.getElementById('g_opp_mid_f').value,
                document.getElementById('g_large_f').value,
                document.getElementById('g_opp_large_s').value
            ];
        } else {
            document.querySelectorAll('#normalChecks input:checked').forEach(i => checksArray.push(i.value));
        }

        const startVal = document.getElementById('startTime').value;
        const endVal = document.getElementById('endTime').value;

        const logData = {
            action: "saveLog",
            phoneId: getPhoneID(),
            category: category,
            id: document.getElementById('displayDevID').innerText.replace("ID: ",""),
            name: document.getElementById('displayDevName').innerText,
            idesignNo: document.getElementById('idesignNo').value,
            workItem: document.getElementById('workItemSelect').value,
            model: document.getElementById('testModel').value,
            user: document.getElementById('testerName').value,
            start: startVal ? startVal.replace("T", " ") : "",
            end: endVal ? endVal.replace("T", " ") : "",
            checks: checksArray
        };

        if (!logData.model || !logData.user) return alert("請填寫完整機種與使用者姓名");
        await fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(logData) });
        alert("資料送出完成！");
        location.reload();
    }
