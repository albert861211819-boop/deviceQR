<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端同步設備管理系統</title>
    <script src="https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0.0.2/qrcode.min.js"></script>
    <style>
        :root { --primary: #007bff; --bg: #f4f7f6; --admin: #6f42c1; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card { border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        /* 管理員樣式 */
        .admin-box { border: 2px dashed var(--admin); padding: 15px; border-radius: 8px; margin-bottom: 20px; background: #f9f6ff; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-submit { background: #28a745; color: white; width: 100%; padding: 12px; }
        .btn-qr { background: var(--primary); color: white; }
        .btn-edit { background: #ffc107; color: #212529; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: left; font-size: 14px; }

        /* QR Code 彈窗 */
        #qrOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .qr-modal { background: white; padding: 30px; border-radius: 15px; text-align: center; max-width: 85%; }

        /* 紀錄樣式 */
        .log-item { background: #f8f9fa; border-left: 5px solid var(--primary); padding: 12px; margin-bottom: 10px; border-radius: 4px; }
        .log-header { font-weight: bold; color: #333; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .log-time { font-size: 12px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <div id="adminPanel" class="admin-box hidden">
        <h3 id="adminTitle" style="color:var(--admin); margin-top:0;">🔧 設備管理清單</h3>
        <input type="text" id="devName" placeholder="輸入設備名稱">
        <input type="text" id="devID" placeholder="輸入編號 (ID)">
        <button id="addBtn" class="btn-submit" onclick="saveDevice()">同步至雲端</button>
        <button id="cancelBtn" class="hidden" style="background:#666; color:white; width:100%; margin-top:5px;" onclick="resetForm()">取消</button>
        
        <table>
            <thead><tr><th>設備資訊</th><th>操作</th></tr></thead>
            <tbody id="adminListBody"></tbody>
        </table>
    </div>

    <div id="qrOverlay" class="hidden" onclick="closeQR()">
        <div class="qr-modal" onclick="event.stopPropagation()">
            <h3 id="qrName" style="margin-top:0;"></h3>
            <div id="qrcode"></div>
            <p id="qrID" style="color:#666; font-size:14px;"></p>
            <button onclick="closeQR()" style="background:#333; color:white; width:100%; padding:10px;">關閉視窗</button>
        </div>
    </div>

    <div id="testView" class="hidden">
        <div style="border-bottom: 3px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px;">
            <h2 id="displayDevName" style="margin:0;">載入中...</h2>
            <small id="displayDevID" style="color:#666;"></small>
        </div>

        <div class="card">
            <input type="text" id="testModel" placeholder="機種型號">
            <input type="text" id="testerName" placeholder="使用者姓名">
            <label style="font-size:12px;">開始時間</label><input type="datetime-local" id="startTime"><br>
            <label style="font-size:12px;">結束時間</label><input type="datetime-local" id="endTime">
            <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
        <h4 style="margin-bottom: 10px; color: #333;">📋 設備點檢項目</h4>
        <div id="checkItems">
            <style>
                .check-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 14px; border-bottom: 1px dashed #f0f0f0; padding-bottom: 8px; }
                .check-label { flex: 1; padding-right: 10px; line-height: 1.4; }
                .check-options { display: flex; gap: 10px; }
                .check-options label { font-size: 13px; font-weight: normal; cursor: pointer; }
            </style>

            <div class="check-row">
    <div class="check-label">1. 電源是否正常？(Input V ± 10%)</div>
    <div class="check-options">
        <label><input type="radio" name="q1" value="正常" checked> 正常</label>
        <label><input type="radio" name="q1" value="異常"> 異常</label>
    </div>
</div>

<div class="check-row">
    <div class="check-label">2. 水槽及水位器，水位是否正常？</div>
    <div class="check-options">
        <label><input type="radio" name="q2" value="正常" checked> 正常</label>
        <label><input type="radio" name="q2" value="異常"> 異常</label>
    </div>
</div>

<div class="check-row">
    <div class="check-label">3. 感濕棉布是否潔淨，吸水性是否良好？</div>
    <div class="check-options">
        <label><input type="radio" name="q3" value="正常" checked> 正常</label>
        <label><input type="radio" name="q3" value="異常"> 異常</label>
    </div>
</div>

<div class="check-row">
    <div class="check-label">4. 溼度保護器是否設定於 130℃~150℃ 間？</div>
    <div class="check-options">
        <label><input type="radio" name="q4" value="正常" checked> 正常</label>
        <label><input type="radio" name="q4" value="異常"> 異常</label>
    </div>
</div>

<div class="check-row">
    <div class="check-label">5. 蒸餾水是否足夠？</div>
    <div class="check-options">
        <label><input type="radio" name="q5" value="正常" checked> 正常</label>
        <label><input type="radio" name="q5" value="異常"> 異常</label>
    </div>
</div>

<div class="check-row">
    <div class="check-label">6. 環境溫溼度是否合乎規定？</div>
    <div class="check-options">
        <label><input type="radio" name="q6" value="正常" checked> 正常</label>
        <label><input type="radio" name="q6" value="異常"> 異常</label>
    </div>
</div>
        </div>
            <button id="submitBtn" class="btn-submit" onclick="saveToLog()">確認送出紀錄</button>
        </div>

        <div class="log-list">
            <h3>📊 歷史紀錄 (雲端)</h3>
            <div id="logContent"><p style="text-align:center; color:#999;">正在連線雲端資料庫...</p></div>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysE22tyQy4bra1DsHloJ7Bq6vGDxEt_oDguO2nq1fu0o1HVFRQs-GnvdmHEv_lLRI/exec"; // ⬅ 替換為你的 GAS URL
    const ADMIN_PASSWORD = "admin";

    window.onload = async function() {
        const params = new URLSearchParams(window.location.search);
        const isAdmin = params.get('mode') === ADMIN_PASSWORD;
        const id = params.get('id');

        if (isAdmin) {
            document.getElementById('adminPanel').classList.remove('hidden');
            refreshAdminList();
        }
        
        if (id) {
            showTestPage(id);
        }
    };

    // --- 管理員函數 ---
    async function saveDevice() {
        const name = document.getElementById('devName').value.trim();
        const id = document.getElementById('devID').value.trim();
        if(!name || !id) return alert("請填寫完整");

        const btn = document.getElementById('addBtn');
        btn.innerText = "同步中...";
        btn.disabled = true;

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST", mode: "no-cors",
                body: JSON.stringify({ action: "saveDevice", id: id, name: name })
            });
            alert("雲端清單更新成功！");
            location.reload();
        } catch (e) {
            alert("同步失敗");
            btn.disabled = false;
        }
    }

    async function refreshAdminList() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?type=list");
            const data = await res.json();
            const body = document.getElementById('adminListBody');
            
            // 跳過標題列並過濾空資料
            const rows = data.slice(1).filter(r => r[0]); 
            body.innerHTML = rows.map(r => `
                <tr>
                    <td><strong>${r[1]}</strong><br><small>ID: ${r[0]}</small></td>
                    <td>
                        <button class="btn-qr" onclick="makeQR('${r[0]}', '${r[1]}')">碼</button>
                        <button class="btn-edit" onclick="fillForm('${r[0]}', '${r[1]}')">改</button>
                    </td>
                </tr>
            `).join('');
        } catch (e) { console.error("抓取清單失敗"); }
    }

    function fillForm(id, name) {
        document.getElementById('devID').value = id;
        document.getElementById('devName').value = name;
        document.getElementById('adminTitle').innerText = "✏️ 編輯設備";
        document.getElementById('addBtn').innerText = "儲存修改";
        document.getElementById('cancelBtn').classList.remove('hidden');
    }

    function resetForm() {
        document.getElementById('devID').value = '';
        document.getElementById('devName').value = '';
        document.getElementById('adminTitle').innerText = "🔧 設備管理清單";
        document.getElementById('addBtn').innerText = "同步至雲端";
        document.getElementById('cancelBtn').classList.add('hidden');
    }

    // --- QR Code 彈窗 ---
    function makeQR(id, name) {
        document.getElementById('qrcode').innerHTML = "";
        const url = window.location.origin + window.location.pathname + "?id=" + encodeURIComponent(id);
        new QRCode(document.getElementById('qrcode'), { text: url, width: 200, height: 200 });
        document.getElementById('qrName').innerText = name;
        document.getElementById('qrID').innerText = "ID: " + id;
        document.getElementById('qrOverlay').classList.remove('hidden');
    }

    function closeQR() { document.getElementById('qrOverlay').classList.add('hidden'); }

    // --- 使用者函數 ---
    async function showTestPage(id) {
        document.getElementById('testView').classList.remove('hidden');
        document.getElementById('displayDevID').innerText = "編號：" + id;

        try {
            // 抓取名稱
            const res = await fetch(GOOGLE_SCRIPT_URL + "?type=list");
            const list = await res.json();
            const dev = list.slice(1).find(r => r[0].toString() === id.toString());
            document.getElementById('displayDevName').innerText = dev ? dev[1] : "新設備 (ID: "+id+")";
        } catch (e) { document.getElementById('displayDevName').innerText = "網路連線異常"; }

        fetchCloudLogs(id);
    }

    async function fetchCloudLogs(id) {
    try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const data = await res.json();
        
        // 跳過標題列並篩選 ID
        const rows = data.slice(1).filter(r => r[0].toString() === id.toString()).reverse();
        const content = document.getElementById('logContent');
        
        if(rows.length === 0) {
            content.innerHTML = "<p style='text-align:center; color:#999;'>尚無紀錄</p>";
            return;
        }

        // 定義一個內部函數來處理時間格式化
        const formatDateTime = (dateStr) => {
            if (!dateStr) return "";
            const d = new Date(dateStr);
            // 檢查是否為有效日期
            if (isNaN(d.getTime())) return dateStr; 

            const Y = d.getFullYear();
            const M = String(d.getMonth() + 1).padStart(2, '0');
            const D = String(d.getDate()).padStart(2, '0');
            const hh = String(d.getHours()).padStart(2, '0'); // 24小時制
            const mm = String(d.getMinutes()).padStart(2, '0');
            
            return `${Y}-${M}-${D} ${hh}:${mm}`;
        };

        content.innerHTML = rows.map(r => `
            <div class="log-item">
                <div class="log-header">
                    <span>機種: ${r[2]}</span>
                    <span>使用者: ${r[3]}</span>
                </div>
                <div class="log-time">
                    時段: ${formatDateTime(r[4])} ～ ${formatDateTime(r[5])}
                </div>
            </div>
        `).join('');
    } catch (e) {
        console.error("抓取紀錄失敗", e);
    }
}

    async function saveToLog() {
    const rawId = document.getElementById('displayDevID').innerText;
    const rawName = document.getElementById('displayDevName').innerText;
    const getVal = (name) => document.querySelector(`input[name="${name}"]:checked`).value;

    const log = {
        action: "saveLog", // 確保 GAS 知道這是存紀錄
        id: rawId.replace("編號：", "").trim(),
        name: rawName.replace("📍 目前設備：", "").trim(),
        model: document.getElementById('testModel').value.trim(),
        user: document.getElementById('testerName').value.trim(),
        start: document.getElementById('startTime').value,
        end: document.getElementById('endTime').value,
        // 分開抓取每一個值
        q1: getVal('q1'),
        q2: getVal('q2'),
        q3: getVal('q3'),
        q4: getVal('q4'),
        q5: getVal('q5'),
        q6: getVal('q6')
    };

    if(!log.model || !log.user || !log.start || !log.end) return alert("請完整填寫紀錄");

    const btn = document.getElementById('submitBtn');
    btn.innerText = "同步紀錄中..."; btn.disabled = true;

    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST", mode: "no-cors",
            body: JSON.stringify(log)
        });
        alert("✅ 點檢紀錄已成功分開存入雲端！");
        location.reload();
    } catch (e) {
        alert("送出失敗，請檢查網路。");
        btn.disabled = false;
        btn.innerText = "確認送出紀錄";
    }
}
</script>
</body>
</html>
