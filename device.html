<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端同步設備管理系統</title>
    <script src="https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0.0.2/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #007bff; --bg: #f4f7f6; --admin: #6f42c1; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card { border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        .admin-box { border: 2px dashed var(--admin); padding: 15px; border-radius: 8px; margin-bottom: 20px; background: #f9f6ff; }
        input, select { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 12px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px; 
            display: block;
        }
        label { font-size: 12px; color: #666; display: block; margin-bottom: 4px; }
        
        /* 時間輸入框樣式 */
        input[type="datetime-local"] {
            width: 100% !important; 
            max-width: 220px !important;    
            flex-grow: 1;
            margin-bottom: 15px;
            padding: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
            height: 38px;
        }
        
        button { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-submit { background: #28a745; color: white; width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; }
        .btn-qr { background: var(--primary); color: white; }
        .btn-confirm { background: #17a2b8; color: white; }
        .btn-edit { background: #ffc107; color: #212529; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: left; font-size: 14px; }

        .check-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 0; 
            border-bottom: 1px solid #eee;
            gap: 10px; 
        }
        
        .check-label { 
            flex: 1; 
            font-size: 14px; 
            color: #333; 
            line-height: 1.3;
            word-break: break-all;
        }
        .check-options { 
            display: flex; 
            gap: 12px; 
            flex-shrink: 0; 
        }
        .check-options label { 
            display: flex !important; 
            align-items: center !important; 
            margin-bottom: 0; 
            font-size: 14px; 
            white-space: nowrap; 
            cursor: pointer;
        }

        .check-options input[type="radio"] { 
            width: 18px !important; 
            height: 18px !important; 
            margin: 0 4px 0 0 !important; 
            flex-shrink: 0;
        }

        /* 摺疊面板樣式 */
        .collapsible {
            background-color: #eee;
            color: #444;
            cursor: pointer;
            padding: 12px;
            width: 100%;
            border: none;
            text-align: left;
            outline: none;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .active, .collapsible:hover { background-color: #ddd; }
        .collapsible:after { content: '\002B'; font-weight: bold; float: right; }
        .active:after { content: "\2212"; }
        
        .content {
            padding: 0 15px;
            display: none;
            overflow: hidden;
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 0 0 6px 6px;
        }
        .g-input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 15px 0;
        }
        .g-input-grid input { margin-bottom: 5px !important; }
        
        #qrOverlay, #scannerOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .qr-modal { background: white; padding: 30px; border-radius: 15px; text-align: center; max-width: 85%; }

        .log-item { background: #f8f9fa; border-left: 5px solid var(--primary); padding: 12px; margin-bottom: 10px; border-radius: 4px; }
        .log-header { font-weight: bold; color: #333; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .log-time-row { font-size: 13px; color: #666; margin-top: 3px; display: flex; gap: 6px; }
        .time-tag { font-weight: bold; }

        /* 相機掃描視窗專用樣式 */
        .scanner-container { width: 300px; background: white; padding: 15px; border-radius: 12px; text-align: center; }
        #reader { width: 100%; }
    </style> 
</head>
<body>

<div class="container">
    <div id="adminPanel" class="admin-box hidden">
        <h3 id="adminTitle" style="color:var(--admin); margin-top:0;">🔧 設備管理清單</h3>
        <input type="text" id="devName" placeholder="輸入設備名稱">
        <input type="text" id="devID" placeholder="輸入編號 (ID)">
        <select id="devCategory">
            <option value="General chamber">General chamber</option>
            <option value="Convection chamber">Convection chamber</option>
            <option value="Vibration tester">Vibration tester</option>
            <option value="Shock tester">Shock tester</option>
            <option value="Drop tester">Drop tester</option>
        </select>
        <button id="addBtn" class="btn-submit" onclick="saveDevice()">新增設備</button>
        <button id="cancelBtn" class="hidden" style="background:#666; color:white; width:100%; margin-top:5px;" onclick="resetForm()">取消</button>
        <table>
            <thead><tr><th>設備資訊</th><th>操作</th></tr></thead>
            <tbody id="adminListBody"></tbody>
        </table>
    </div>

    <div id="qrOverlay" class="hidden" onclick="closeQR()">
        <div class="qr-modal" onclick="event.stopPropagation()">
            <div id="qrcode" style="display: flex; justify-content: center; margin-bottom: 15px;"></div>
            <h3 id="qrName" style="margin: 5px 0;"></h3>
            <p id="qrID" style="color:#666; margin-bottom: 15px;"></p>
            <button onclick="closeQR()" style="background:#333; color:white; width:100%;">關閉</button>
        </div>
    </div>

    <div id="scannerOverlay" class="hidden">
        <div class="scanner-container">
            <h4 style="margin-top:0; margin-bottom:10px;">請對準 QR Code 掃描</h4>
            <div id="reader"></div>
            <button onclick="stopScanner()" style="background:#dc3545; color:white; width:100%; margin-top:10px;">取消掃描</button>
        </div>
    </div>

    <div id="testView" class="hidden">
        <h2 id="displayDevName" style="margin-bottom: 5px;">載入中...</h2>
        <small id="displayDevID" style="color:#666; font-size:14px; display:block; margin-bottom:15px;"></small>
        
        <div class="card">
            <label>IDesign No.</label>
            <div style="display: flex; gap: 6px; margin-bottom: 12px;">
                <input type="text" id="idesignNo" placeholder="輸入或掃描 IDesign No." style="margin-bottom: 0;" onkeydown="if(event.key==='Enter') submitIDesign();">
                <button type="button" class="btn-confirm" style="white-space: nowrap; padding: 0 12px;" onclick="submitIDesign()">確認</button>
                <button type="button" class="btn-qr" style="white-space: nowrap; padding: 0 12px;" onclick="startScanner()">掃描 QR</button>
            </div>

            <label>機種型號</label>
            <input type="text" id="testModel" placeholder="機種型號">
            
            <label>使用者姓名</label>
            <input type="text" id="testerName" placeholder="使用者姓名">
            
            <label>測試項目</label>
            <select id="workItemSelect">
                <option value="">-- 請選擇或帶入測試項目 --</option>
            </select>

            <label>開始時間</label>
            <input type="datetime-local" id="startTime">
            
            <div id="endTimeWrapper">
                <label>結束時間</label>
                <input type="datetime-local" id="endTime">
            </div>
            
            <div id="checkItems">
                <h4 style="margin-bottom: 10px;">📋 點檢項目</h4>
                <div id="normalChecks"></div>
            </div>

            <div id="dropInputs" class="hidden">
                <h4 style="margin-bottom: 10px;">📦 Drop Data</h4>
                <input type="number" id="dropL" placeholder="Length (mm)">
                <input type="number" id="dropW" placeholder="Width (mm)">
                <input type="number" id="dropH" placeholder="Height (mm)">
                <input type="number" id="dropWeight" placeholder="Weight (kg)">
                <input type="number" id="dropHeight" placeholder="Drop height (mm)">

                <button type="button" class="collapsible" onclick="toggleCollapsible(this)">加速規數值錄入 (g)</button>
                <div class="content">
                    <div class="g-input-grid">
                        <input type="number" id="g_corner" placeholder="Corner">
                        <input type="number" id="g_short_e" placeholder="Short edge">
                        <input type="number" id="g_mid_e" placeholder="Mid edge">
                        <input type="number" id="g_long_e" placeholder="Long edge">
                        <input type="number" id="g_small_f" placeholder="Small face">
                        <input type="number" id="g_opp_small_f" placeholder="Oppsite small f.">
                        <input type="number" id="g_mid_f" placeholder="Mid face">
                        <input type="number" id="g_opp_mid_f" placeholder="Oppsite mid f.">
                        <input type="number" id="g_large_f" placeholder="Large face">
                        <input type="number" id="g_opp_large_s" placeholder="Oppsite large s.">      
                    </div>
                </div>             
            </div>
            
            <button id="submitBtn" class="btn-submit" onclick="saveToLog()">確認送出紀錄</button>
        </div>

        <div class="log-list">
            <h3>📊 本月紀錄</h3>
            <div id="logContent">載入中...</div>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwIKu1gtR8kP4LDIanf6279-BTQa9PXCQy3TCRR0pCFGAb_17M5w3z_hz887yi43kM/exec";
    const ADMIN_PASSWORD = "admin";
    const CHECK_CONFIG = {
        "General chamber": ["電源是否正常？(Input V ± 10%)", "水槽及水位器，水位是否正常？", "感濕棉布是否潔淨，吸水性是否良好？", "溼度保護器是否設定於 130℃~150℃ 間？", "蒸餾水是否足夠？", "環境溫溼度是否合乎規定？"],
        "Convection chamber": ["電源是否正常？(230VAC±10%)", "環境溫度是否合乎規定？"],
        "Vibration tester": ["環境溫度是否合乎規定？", "Shaker冷卻風扇是否正常運作？", "確認空壓系統運作正常？", "Shaker氣囊充氣是否足夠？", "溫機10分鐘？"],
        "Shock tester": ["確認氣壓瓶內壓力量是否足夠？", "檢查氣壓式彈簧氣墊是否異常？", "確認機台是否水平？", "確認電源開關、近接開關、E.M.G.按鈕是否異常？", "不相關物品不要放置於輔助平台上，以免影響測試。"]
    };

    let html5QrCode = null;

    window.onload = async function() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('mode') === ADMIN_PASSWORD) {
            document.getElementById('adminPanel').classList.remove('hidden');
            refreshAdminList();
        }
        const id = params.get('id');
        if (id) showTestPage(id);
    };

    /* 觸發確認按鈕事件 */
    function submitIDesign() {
        const val = document.getElementById('idesignNo').value;
        if (!val) {
            alert("請先輸入 IDesign No.");
            return;
        }
        fetchIDesignData(val);
    }

    /* 處理 IDesign API 抓取邏輯 (經 GAS 轉接) */
    async function fetchIDesignData(requestID) {
        if (!requestID) return;
        const gasApiUrl = `${GOOGLE_SCRIPT_URL}?type=getIDesign&requestId=${encodeURIComponent(requestID.trim())}`;
        
        try {
            const res = await fetch(gasApiUrl);
            const data = await res.json();
            
            if (data.error) {
                alert("API 轉接錯誤：" + data.error);
                return;
            }

            if (Array.isArray(data) && data.length > 0) {
                const firstItem = data[0];
                
                // 1. 自動填入機種型號
                if (firstItem.ProductName) {
                    document.getElementById('testModel').value = firstItem.ProductName;
                }
                
                // 2. 自動填入使用者姓名 (@ 前方的字串)
                if (firstItem.Engineer) {
                    const engineerName = firstItem.Engineer.split('@')[0];
                    document.getElementById('testerName').value = engineerName;
                }
                
                // 3. 提取所有相異的 WorkItem 自動產生選單選項
                const workItems = [...new Set(data.map(item => item.WorkItem).filter(Boolean))];
                const selectElem = document.getElementById('workItemSelect');
                selectElem.innerHTML = '<option value="">-- 請選擇測試項目 --</option>';
                
                workItems.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.textContent = item;
                    selectElem.appendChild(opt);
                });
                if (workItems.length > 0) selectElem.selectedIndex = 1;

            } else {
                alert("未找到對應的 IDesign 資料");
            }
        } catch (e) {
            console.error("Fetch IDesign API Error:", e);
            alert("讀取 IDesign API 失敗，請確認網路連線或 RequestID 是否正確");
        }
    }

    /* 相機 QR 掃描器控制 */
    function startScanner() {
        document.getElementById('scannerOverlay').classList.remove('hidden');
        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 200, height: 200 } },
            (decodedText) => {
                document.getElementById('idesignNo').value = decodedText;
                stopScanner();
                fetchIDesignData(decodedText);
            },
            (errorMessage) => { /* 掃描過程中忽略持續發生的失敗 */ }
        ).catch(err => {
            alert("無法啟動相機: " + err);
            stopScanner();
        });
    }

    function stopScanner() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().then(() => {
                document.getElementById('scannerOverlay').classList.add('hidden');
            }).catch(err => {
                console.error("Stop scanner error:", err);
                document.getElementById('scannerOverlay').classList.add('hidden');
            });
        } else {
            document.getElementById('scannerOverlay').classList.add('hidden');
        }
    }

    function toggleCollapsible(btn) {
        btn.classList.toggle("active");
        var content = btn.nextElementSibling;
        content.style.display = (content.style.display === "block") ? "none" : "block";
    }
    
    function getNowStr() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const h = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        
        return `${y}-${m}-${d}T${h}:${min}`;
    }

    function getPhoneID() {
        let id = localStorage.getItem('my_device_id');
        if (!id) {
            id = 'P-' + Math.floor(Math.random() * 1000000);
            localStorage.setItem('my_device_id', id);
        }
        return id;
    }

    function formatForInput(date) {
        const d = new Date(date);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    async function refreshAdminList() {
        const res = await fetch(GOOGLE_SCRIPT_URL + "?type=list");
        const data = await res.json();
        document.getElementById('adminListBody').innerHTML = data.slice(1).map(r => `
            <tr>
                <td>${r[1]}<br><small>ID=${r[0]}</small></td>
                <td><button class="btn-qr" onclick="makeQR('${r[0]}','${r[1]}')">QR</button></td>
            </tr>`).join('');
    }

    async function saveDevice() {
        const id = document.getElementById('devID').value;
        const name = document.getElementById('devName').value;
        const cat = document.getElementById('devCategory').value;
        await fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "saveDevice", id, name, category: cat })});
        location.reload();
    }

    function makeQR(id, name) {
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById('qrcode'), window.location.origin + window.location.pathname + "?id=" + id);
        document.getElementById('qrName').innerText = name;
        document.getElementById('qrID').innerText = "ID: " + id;
        document.getElementById('qrOverlay').classList.remove('hidden');
    }

    function closeQR() { document.getElementById('qrOverlay').classList.add('hidden'); }

    async function showTestPage(id) {
        document.getElementById('testView').classList.remove('hidden');
        document.getElementById('displayDevID').innerText = "ID: " + id;
        document.getElementById('startTime').value = getNowStr();

        const res = await fetch(GOOGLE_SCRIPT_URL + "?type=list");
        const list = await res.json();
        const dev = list.find(r => r[0].toString() === id.toString());
        
        if (dev) {
            const category = dev[2];
            window.currentCategory = category;
            document.getElementById('displayDevName').innerText = dev[1];

            if (category === "Drop tester") {
                document.getElementById('dropInputs').classList.remove('hidden');
                document.getElementById('checkItems').classList.add('hidden');
                document.getElementById('endTimeWrapper').classList.add('hidden');
            } else {
                document.getElementById('dropInputs').classList.add('hidden');
                document.getElementById('checkItems').classList.remove('hidden');
                document.getElementById('endTimeWrapper').classList.remove('hidden');

                const items = CHECK_CONFIG[category] || [];
                document.getElementById('normalChecks').innerHTML = items.map((t, i) => `
                    <div class="check-row"><span class="check-label">${t}</span>
                    <div class="check-options">
                        <label><input type="radio" name="q${i}" value="正常" checked> 正常</label>
                        <label><input type="radio" name="q${i}" value="異常"> 異常</label>
                    </div></div>`).join('');
                
                // 檢查未完成紀錄
                const resLogs = await fetch(`${GOOGLE_SCRIPT_URL}?category=${encodeURIComponent(category)}`);
                const logs = await resLogs.json();
                const unfinished = logs.slice(1).reverse().find(r => r[0].toString() === id.toString() && !r[5] && r[6] === getPhoneID());
                if (unfinished) {
                    document.getElementById('testModel').value = unfinished[2];
                    document.getElementById('testerName').value = unfinished[3];
                    document.getElementById('startTime').value = formatForInput(unfinished[4]);
                    document.getElementById('endTime').value = getNowStr();
                    document.getElementById('endTime').style.border = "2px solid red";
                }
            }
            fetchCloudLogs(id, category);
        }
    }

    async function fetchCloudLogs(id, cat) {
        const content = document.getElementById('logContent');
        try {
            const res = await fetch(`${GOOGLE_SCRIPT_URL}?category=${encodeURIComponent(cat)}`);
            const data = await res.json();
            
            const now = new Date();
            const currentMonthStr = `${now.getFullYear()}-${(now.getMonth() + 1).toString().padStart(2, '0')}`;

            const rows = data.slice(1).filter(r => {
                if (!r[4]) return false;
                return r[0].toString() === id.toString() && r[4].toString().startsWith(currentMonthStr);
            }).reverse();

            if (rows.length === 0) {
                content.innerHTML = "<p style='text-align:center; color:#999; font-size:14px;'>本月尚無紀錄</p>";
                return;
            }

            content.innerHTML = rows.map(r => {
                const rawFormat = (val) => {
                    if (!val) return null;
                    return val.toString().replace('T', ' ').substring(0, 16);
                };

                const startTime = rawFormat(r[4]) || '---';
                const endTime = rawFormat(r[5]) || '<span style="color:#dc3545; font-weight:bold;">進行中</span>';
                
                const isDropTester = (cat === "Drop tester");
                const endTimeHTML = isDropTester ? '' : `
                    <div class="log-time-row">
                        <span class="time-tag">終:</span>
                        <span class="time-val">${endTime}</span>
                    </div>`;

                return `
                    <div class="log-item">
                        <div class="log-header">
                            <span>機種: ${r[2]}</span>
                            <span style="font-weight:normal; color:#666;">使用者: ${r[3]}</span>
                        </div>
                        <div class="log-body">
                            <div class="log-time-row">
                                <span class="time-tag">始:</span>
                                <span class="time-val">${startTime}</span>
                            </div>
                            ${endTimeHTML} 
                        </div>
                    </div>`;
            }).join('');
        } catch (e) {
            content.innerHTML = "<p style='text-align:center; color:red;'>紀錄載入失敗</p>";
        }
    }

    async function saveToLog() {
        const category = window.currentCategory;
        let checksArray = [];
        
        if (category === "Drop tester") {
            checksArray = [
                document.getElementById('dropL').value,
                document.getElementById('dropW').value,
                document.getElementById('dropH').value,
                document.getElementById('dropWeight').value,
                document.getElementById('dropHeight').value,
                document.getElementById('g_corner').value,
                document.getElementById('g_short_e').value,
                document.getElementById('g_mid_e').value,
                document.getElementById('g_long_e').value,
                document.getElementById('g_small_f').value,
                document.getElementById('g_opp_small_f').value,
                document.getElementById('g_mid_f').value,
                document.getElementById('g_opp_mid_f').value,
                document.getElementById('g_large_f').value,
                document.getElementById('g_opp_large_s').value
            ];
        } else {
            document.querySelectorAll('#normalChecks input:checked').forEach(i => checksArray.push(i.value));
        }

        const startVal = document.getElementById('startTime').value;
        const endVal = document.getElementById('endTime').value;

        const logData = {
            action: "saveLog",
            phoneId: getPhoneID(),
            category: category,
            id: document.getElementById('displayDevID').innerText.replace("ID: ",""),
            name: document.getElementById('displayDevName').innerText,
            model: document.getElementById('testModel').value,
            user: document.getElementById('testerName').value,
            workItem: document.getElementById('workItemSelect').value,
            idesignNo: document.getElementById('idesignNo').value,
            start: startVal ? startVal.replace("T", " ") : "",
            end: endVal ? endVal.replace("T", " ") : "",
            checks: checksArray
        };

        if (!logData.model || !logData.user) return alert("請填寫完整機種與使用者姓名");
        await fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(logData) });
        alert("資料送出完成！");
        location.reload();
    }
</script>
