<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設備管理與紀錄同步系統</title>
    <script src="https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0.0.2/qrcode.min.js"></script>
    <style>
        :root { --primary: #007bff; --bg: #f4f7f6; --admin: #6f42c1; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card { border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        .admin-box { border: 2px dashed var(--admin); padding: 15px; border-radius: 8px; margin-bottom: 20px; background: #f9f6ff; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        
        button { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-submit { background: #28a745; color: white; width: 100%; font-size: 16px; padding: 12px; }
        .btn-qr { background: var(--primary); color: white; }
        .btn-edit { background: #ffc107; color: #212529; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: left; }

        /* QR Code 置中彈窗 */
        #qrOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .qr-modal {
            background: white; padding: 30px; border-radius: 15px; text-align: center;
            max-width: 85%; box-shadow: 0 5px 30px rgba(0,0,0,0.5);
        }
        #qrcode { display: inline-block; padding: 10px; background: white; border: 1px solid #eee; margin-bottom: 10px; }

        /* 雲端紀錄列表 */
        .log-list h3 { border-left: 5px solid var(--primary); padding-left: 10px; margin-top: 25px; }
        .log-item { background: #f8f9fa; border: 1px solid #eee; padding: 12px; margin-bottom: 10px; border-radius: 6px; font-size: 14px; }
        .log-header { display: flex; justify-content: space-between; margin-bottom: 5px; color: var(--primary); font-weight: bold; }
        .log-time { font-size: 12px; color: #666; }
        .loading-text { text-align: center; color: #999; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div id="adminPanel" class="admin-box hidden">
        <h3 id="adminTitle" style="color:var(--admin); margin:0 0 15px 0;">🔧 管理員模式</h3>
        <input type="hidden" id="editIndex" value="-1">
        <input type="text" id="devName" placeholder="設備名稱 (如: 示波器 A)">
        <input type="text" id="devID" placeholder="唯一編號 (如: OSC-01)">
        <button id="addBtn" class="btn-submit" style="background:var(--admin)" onclick="saveDevice()">儲存設備資料</button>
        <button id="cancelBtn" class="hidden" style="background:#666; color:white; width:100%; margin-top:5px;" onclick="resetForm()">取消編輯</button>
        
        <table>
            <thead><tr><th>設備</th><th>操作</th></tr></thead>
            <tbody id="adminListBody"></tbody>
        </table>
    </div>

    <div id="qrOverlay" class="hidden" onclick="closeQR()">
        <div class="qr-modal" onclick="event.stopPropagation()">
            <h3 id="qrName" style="margin-top:0;"></h3>
            <div id="qrcode"></div>
            <p id="qrID" style="color:#666; font-size:13px;"></p>
            <button onclick="closeQR()" style="background:#333; color:white; width:100%; padding:10px;">關閉視窗</button>
        </div>
    </div>

    <div id="testView" class="hidden">
        <div style="border-bottom: 3px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px;">
            <h2 id="displayDevName" style="margin:0;">載入中...</h2>
            <small id="displayDevID" style="color:#666; font-weight:bold;"></small>
        </div>

        <div class="card">
            <label>測試機種</label><input type="text" id="testModel" placeholder="輸入產品型號">
            <label>使用者</label><input type="text" id="testerName" placeholder="填寫姓名">
            <label>起始時間</label><input type="datetime-local" id="startTime">
            <label>結束時間</label><input type="datetime-local" id="endTime">
            <button id="submitBtn" class="btn-submit" onclick="saveToCloud()">確認並送出紀錄</button>
        </div>

        <div class="log-list">
            <h3>📊 設備歷史紀錄 (雲端同步)</h3>
            <div id="logContent"><div class="loading-text">正在從雲端抓取歷史資料...</div></div>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysE22tyQy4bra1DsHloJ7Bq6vGDxEt_oDguO2nq1fu0o1HVFRQs-GnvdmHEv_lLRI/exec"; // ⬅ 務必填入你的 GAS 網頁應用程式網址
    const ADMIN_PASSWORD = "admin";
    let devices = JSON.parse(localStorage.getItem('dev_db_v6')) || [];

   window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const isAdmin = params.get('mode') === ADMIN_PASSWORD;
    const id = params.get('id');

    if (isAdmin) {
        document.getElementById('adminPanel').classList.remove('hidden');
        renderAdminTable();
    }
    
    if (id) {
        // 【核心修正】：從本機儲存的設備清單中，根據 ID 找回對應的名稱
        const dev = devices.find(d => d.id === id);
        const nameToDisplay = dev ? dev.name : "未知設備 (ID: " + id + ")";
        
        showTestPage(id, nameToDisplay);
    } else if (!isAdmin) {
        document.getElementById('noDataHint').classList.remove('hidden');
    }
};

    // 管理員功能
    function saveDevice() {
        const name = document.getElementById('devName').value.trim();
        const id = document.getElementById('devID').value.trim();
        const editIndex = parseInt(document.getElementById('editIndex').value);
        if(!name || !id) return alert("請填寫完整");

        if(editIndex === -1) {
            if(devices.find(d => d.id === id)) return alert("ID 已存在");
            devices.push({name, id});
        } else {
            devices[editIndex] = {name, id};
        }
        localStorage.setItem('dev_db_v6', JSON.stringify(devices));
        resetForm(); renderAdminTable();
    }

    function editDevice(index) {
        const d = devices[index];
        document.getElementById('devName').value = d.name;
        document.getElementById('devID').value = d.id;
        document.getElementById('editIndex').value = index;
        document.getElementById('adminTitle').innerText = "✏️ 編輯設備";
        document.getElementById('cancelBtn').classList.remove('hidden');
    }

    function resetForm() {
        document.getElementById('devName').value = '';
        document.getElementById('devID').value = '';
        document.getElementById('editIndex').value = '-1';
        document.getElementById('adminTitle').innerText = "🔧 管理員模式";
        document.getElementById('cancelBtn').classList.add('hidden');
    }

    function renderAdminTable() {
        const body = document.getElementById('adminListBody');
        body.innerHTML = devices.map((d, i) => `
            <tr>
                <td><strong>${d.name}</strong><br><small>${d.id}</small></td>
                <td>
                    <button class="btn-qr" onclick="makeQR('${d.id}', '${d.name}')">碼</button>
                    <button class="btn-edit" onclick="editDevice(${i})">改</button>
                </td>
            </tr>
        `).join('');
    }

    function makeQR(id, name) {
        document.getElementById('qrcode').innerHTML = "";
        const baseUrl = window.location.origin + window.location.pathname;
        const finalUrl = `${baseUrl}?id=${encodeURIComponent(id)}`;
        new QRCode(document.getElementById('qrcode'), { text: finalUrl, width: 200, height: 200 });
        document.getElementById('qrName').innerText = name;
        document.getElementById('qrID').innerText = `ID: ${id}`;
        document.getElementById('qrOverlay').classList.remove('hidden');
    }

    function closeQR() { document.getElementById('qrOverlay').classList.add('hidden'); }

    // 使用者功能
    async function showTestPage(id) {
    document.getElementById('testView').classList.remove('hidden');
    document.getElementById('displayDevID').innerText = "設備編號：" + id;
    document.getElementById('displayDevName').innerText = "名稱抓取中...";

    try {
        // 從雲端抓取「清單 (type=list)」
        const response = await fetch(GOOGLE_SCRIPT_URL + "?type=list");
        const listData = await response.json();
        
        // 在清單中搜尋該 ID 對應的名稱
        const device = listData.find(row => row[0].toString() === id.toString());
        
        if (device) {
            document.getElementById('displayDevName').innerText = "📍 目前設備：" + device[1];
        } else {
            document.getElementById('displayDevName').innerText = "📍 未知設備 (請管理員先新增)";
        }
    } catch (e) {
        document.getElementById('displayDevName').innerText = "📍 連線失敗，請檢查網路";
    }

    fetchCloudLogs(id); // 抓取該設備的歷史紀錄
}

// 修改管理員新增設備的函數，讓它同步到雲端
async function saveDevice() {
    const name = document.getElementById('devName').value.trim();
    const id = document.getElementById('devID').value.trim();
    if(!name || !id) return alert("請填寫完整");

    // 送交雲端存檔
    await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({ action: "saveDevice", id: id, name: name })
    });

    alert("設備已建立並同步至雲端清單！");
    location.reload(); 
}

    // 重點：直接從 Google 抓取該設備所有紀錄
    async function fetchCloudLogs(id) {
        try {
            const response = await fetch(GOOGLE_SCRIPT_URL);
            const allData = await response.json();
            // 假設試算表格式: ID, 名稱, 機種, 使用者, 開始, 結束, 上傳時間
            // 篩選 ID 一致的資料並反轉（最新的在上面）
            const filtered = allData.slice(1).filter(row => row[0] == id).reverse();
            
            const logContent = document.getElementById('logContent');
            if (filtered.length === 0) {
                logContent.innerHTML = "<div class='loading-text'>目前尚無雲端紀錄</div>";
                return;
            }

            logContent.innerHTML = filtered.map(row => `
                <div class="log-item">
                    <div class="log-header">
                        <span>機種: ${row[2]}</span>
                        <span>使用者: ${row[3]}</span>
                    </div>
                    <div class="log-time">時段: ${row[4].replace('T',' ')} ～ ${row[5].replace('T',' ')}</div>
                </div>
            `).join('');
        } catch (e) {
            document.getElementById('logContent').innerHTML = "<div class='loading-text' style='color:red;'>無法讀取雲端資料，請檢查網路。</div>";
        }
    }

    async function saveToCloud() {
        const btn = document.getElementById('submitBtn');
        const log = {
            id: document.getElementById('displayDevID').innerText,
            name: document.getElementById('displayDevName').innerText,
            model: document.getElementById('testModel').value,
            user: document.getElementById('testerName').value,
            start: document.getElementById('startTime').value,
            end: document.getElementById('endTime').value
        };
        if(!log.model || !log.user || !log.start || !log.end) return alert("請完整填寫欄位");
        
        btn.disabled = true; btn.innerText = "同步中...";
        try {
            await fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(log) });
            alert("✅ 紀錄已成功上傳！");
            location.reload(); // 重新整理以抓取最新列表
        } catch (e) {
            alert("連線失敗"); btn.disabled = false; btn.innerText = "確認並送出紀錄";
        }
    }
</script>
</body>
</html>
